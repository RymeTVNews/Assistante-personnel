name: sarra_assistante
description: Sarra, assistante vocale personnelle de Nathalie.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  permission_handler: ^11.3.1
  flutter_contacts: ^1.1.9+2
  android_intent_plus: ^5.2.0
  shared_preferences: ^2.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/
